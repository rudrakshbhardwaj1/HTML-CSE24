<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form </form></title>
</head>
<body>
    <form action="" name="rudraksh" target="_blank" method="get">
        <fieldset>
            <legend>Personal info</legend> <br>

            <label for="name">name</label>
            <input type="text" id="name" name="name"
            placeholder="enter your name" required> <br><br>

            <label for="email">email</label>
            <input type="email"id="name" name="name"
            placeholder="enter your mail" required> <br><br>

            <label for="dob">DOB:</label>
            <input type="date"><br><br>

            <label for="phone">phone</label>
            <input type="tel" id="phone" name="phone"
            placeholder="enter your number" required> <br> <br>

            <label for="add">address</label>
            <textarea name="address" id="address" rows="5"></textarea> <br><br>

            <label for="password">password</label>
            <input type="password" required> <br> <br>

            <label for="attempt">attempt</label>
            <input type="number" min="1" max="10" required> <br> <br>

            <label for="gender">gender</label>
            <input type="radio" name="gender" id="male"
            value="male" required>male
            <input type="radio" name="gender" id="female"
            value="female" required>female <br> <br>

            <label for="check">vehicles u have</label>
            <input type="checkbox" id="car" name="vehicle 1">car
            <input type="checkbox" id="bike" name="vehicle 2">bike
            <input type="checkbox" id="more" name="vehicle 3">others <br>
             <br>

             <label for="select"> select your lang</label>
            <select name="select" id="select">
                <option> select your choice</option>
                <optgroup label="lang 1">
                <option value="c">C</option>
                <option value="c++">C++</option>
                <option value="javascripts">javascripts</option>
                <option value="html">html</option></optgroup>

                <optgroup label="lang 2">
                <option value="c">C</option>
                <option value="c++">C++</option>
                <option value="javascripts">javascripts</option>
                <option value="html">html</option></optgroup>

            </select> <br> <br>
            <label for="upload">File upload</label>
            <input type="file" required> <br> <br>

            <label for="appointment">appointment</label>
            <input type="time"> <br> <br>

            <label for="link">Link</label>
            <input type="url" >

            <input type="submit">
            <input type="reset">




        </fieldset>





    </form>
</body> 
</html>
